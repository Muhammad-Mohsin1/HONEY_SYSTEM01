<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title><link rel="stylesheet" href="css/style.css"></head>
<body class="login-page">
<div class="login-card">
  <div class="brand-mark">🍯</div><h1>Admin Login</h1><p>Sign in to manage honey sales.</p>
  <form id="loginForm">
    <label>Username<input id="username" autocomplete="username" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary full" type="submit">Login</button>
    <div id="loginError" class="error"></div>
  </form>
  <a class="back-link" href="index.html">← Back</a>
</div>
<script src="js/config.js"></script><script src="js/storage.js"></script><script src="js/auth.js"></script>
</body></html>
